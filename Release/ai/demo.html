token.placeholder=t.token;$('state').textContent=t[status]+(status==='failure'&&errorCode?' · '+(t[errorCode]||errorCode):'');$('read').disabled=status==='loading';
$('rows').replaceChildren();$('json').textContent=snapshot?JSON.stringify(snapshot,null,2):'';
if(!snapshot){$('source').textContent=status==='failure'?t.unavailable:t.idle;$('summary').textContent=status==='failure'?t.check:t.empty;return}
const age=Date.now()-Date.parse(snapshot.capturedAtUtc);const stale=age>5000||age< -5000;
$('source').textContent=snapshot.connectionSource==='demo'?t.demo:t.real;
$('summary').textContent=[snapshot.connected?t.connected:t.disconnected,t.windows+': '+snapshot.windows.length,t.captured+': '+new Date(snapshot.capturedAtUtc).toLocaleString(language),t.age+': '+new Intl.NumberFormat(language).format(Math.max(0,Math.round(age)))+' ms',t.units].join(' · ');
for(const w of snapshot.windows)for(const v of w.values){
const quality=stale?t.stale:(t[w.quality]||t.unknown);
const row=document.createElement('tr');for(const value of [String(w.title??'')+' / '+String(w.slave??''),v.address,v.name||t.unnamed,v.rawWords.join(', '),v.displayValue,quality]){const cell=document.createElement('td');cell.textContent=value??'';row.append(cell)}$('rows').append(row)}
}
$('language').onchange=()=>{language=$('language').value;render()};
$('read').onclick=async()=>{status='loading';errorCode='';render();try{
const response=await fetch('/v1/snapshot',{headers:{Authorization:'Bearer '+token.value},cache:'no-store'});if(!response.ok){errorCode='HTTP '+response.status;throw Error()}
const data=await response.json();if(!data||!Array.isArray(data.windows)||!Number.isFinite(Date.parse(data.capturedAtUtc))||!data.windows.every(w=>w&&Array.isArray(w.values)&&w.values.every(v=>v&&Array.isArray(v.rawWords)))){errorCode='invalid';throw Error()}
snapshot=data;status='success';
}catch{snapshot=null;status='failure'}render()};
render();
</script></body></html>
